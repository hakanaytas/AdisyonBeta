/* ADIO V2 — flat tables + orange visual language */
:root{--primary:#bd520e;--primary2:#d86917;--accent:#f0781b;--accentdark:#d65e0d;--accentlight:#fff0df;--bg:#fff8f2;--line:#efdfce;--text:#302820;--muted:#806f61;--shadow:0 3px 16px #9b551118;--gold:#eea12c}

.home-heading{display:flex;flex-direction:column;gap:3px}

.table-count{font-size:12px;min-width:24px;height:23px;display:inline-grid;place-items:center;background:#ffebd3;color:#b65b12;border-radius:30px;padding:0 8px;letter-spacing:0}

.mobile-check-shortcut{display:none}
.order-screen{background:#fffbf7}
.check-panel{border-right:1px solid #f1ddc6}

<script>
'use strict';
const STORAGE='adisyon_pos_v1';
const icons={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',back:'<path d="m14 6-6 6 6 6M8 12h13"/>',house:'<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',clipboard:'<rect x="5" y="5" width="14" height="17" rx="2"/><path d="M9 5V3h6v2M9 11h6M9 15h6"/>',orders:'<path d="M4 4h16v16H4zM9 4v16M13 9h4M13 13h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',print:'<path d="M6 9V3h12v6M6 18H4V9h16v9h-2M6 15h12v6H6z"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-4 3-7 7-7s7 3 7 7M17 7a3 3 0 0 1 0 6M18 15c3 0 4 2 4 5"/>',edit:'<path d="m4 16 12-12 4 4L8 20H4v-4z"/>',trash:'<path d="M4 7h16M9 4h6M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',check:'<path d="m4 12 5 5L20 6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 9a8 8 0 0 1 14-2l1 5M4 12l1 5a8 8 0 0 0 14-2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20V7M2 20h21"/>',wallet:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M16 14h3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 20h16"/>',upload:'<path d="M12 20V7m-5 5 5-5 5 5M4 4h16"/>',tag:'<path d="M3 3h10l8 9-9 9-9-8V3z"/><circle cx="8" cy="8" r="1"/>',coffee:'<path d="M4 8h13v5a6 6 0 0 1-12 0V8zM17 9h2a3 3 0 0 1 0 6h-2M3 21h17"/>',bag:'<path d="M4 9h16l-1 12H5L4 9zM8 9V7a4 4 0 0 1 8 0v2"/>',truck:'<path d="M2 6h12v12H2zM14 10h4l4 4v4h-8M5 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM18 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>',table:'<path d="M3 7h18v4H3zM6 11v10M18 11v10"/>',filter:'<path d="M3 5h18M6 12h12M9 19h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',person:'<circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',arrow:'<path d="m9 6 6 6-6 6"/>',checkCircle:'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',receipt:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3zM8 8h8M8 12h8"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'};
function ic(n,cl=''){return `<svg class="ico ${cl}" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.info}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function fmt(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n)||0)}
function time(x){return new Date(x).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function dateTime(x){return new Date(x).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'})}
function dateKey(x){const d=new Date(x),p=v=>String(v).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
const seedCategories=['SICAK İÇECEKLER','SOĞUK İÇECEKLER','MİLKSHAKELER','TATLILAR VE PASTALAR','YİYECEKLER','EKSTRALAR','MAKARNALAR','DONDURMALAR','KAHVELER','SOĞUK KAHVELER','FROZENLER','NARGİLE','SALATALAR'];
const seedProducts=[
[0,'Türk kahvesi',140],[0,'Sıcak süt',100],[0,'Sahlep',150],[0,'Çay',35],[0,'Cafe su',40],[0,'Sıcak çikolata',160],[0,'Ballı süt',145],[0,'Bitki çayı',140],[0,'Double Çay',70],[0,'Meyve Çayı',40],[0,'Cafe Çay',40],
[1,'Limonata',110],[1,'Kola',90],[1,'Fanta',90],[1,'Sprite',90],[1,'Su',30],[1,'Soda',45],[1,'Ice Tea',85],[1,'Churchill',90],
[2,'Çilek Milkshake',165],[2,'Çikolatalı Milkshake',165],[2,'Muzlu Milkshake',165],[2,'Oreo Milkshake',180],
[3,'San Sebastian',195],[3,'Tiramisu',180],[3,'Magnolia',170],[3,'Brownie',180],[3,'Cheesecake',185],
[4,'Tost',145],[4,'Karışık Tost',175],[4,'Hamburger',280],[4,'Patates Kızartması',145],[4,'Tavuk Wrap',245],[4,'Pizza',320],
[5,'Ekstra Süt',25],[5,'Ekstra Shot',50],[5,'Ekstra Sos',25],[5,'Dondurma Topu',45],
[6,'Penne Arabiata',245],[6,'Fettuccine Alfredo',285],[6,'Spagetti Bolonez',275],
[7,'Vanilyalı Dondurma',95],[7,'Çikolatalı Dondurma',95],[7,'Karışık Dondurma',130],
[8,'Espresso',105],[8,'Double Espresso',135],[8,'Americano',140],[8,'Latte',160],[8,'Cappuccino',160],[8,'Mocha',175],[8,'Filtre Kahve',135],
[9,'Ice Latte',165],[9,'Ice Americano',145],[9,'Ice Mocha',180],[9,'Cold Brew',165],[9,'Frappe',185],
[10,'Çilek Frozen',175],[10,'Mango Frozen',175],[10,'Limon Frozen',165],
[11,'Yanık Şeftali',350],[11,'Kapuçino',350],[11,'Anason',350],[11,'Love Lady',350],[11,'Mango Ananas',350],[11,'Nargile Lüle',150],
[12,'Akdeniz Salata',185],[12,'Sezar Salata',245],[12,'Ton Balıklı Salata',235]
];
function defaultState(){let categories=seedCategories.map((name,i)=>({id:'cat'+i,name}));let zones=[{id:'z1',name:'Salon'}];let tables=[];for(let i=1;i<=24;i++)tables.push({id:`z1_t${i}`,zoneId:'z1',name:'Masa '+i});return {version:1,settings:{business:'',operator:'Kasiyer',showTips:true,setupDone:false},categories,zones,tables,products:seedProducts.map(([c,name,price],i)=>({id:'p'+i,categoryId:'cat'+c,name,price,active:true})),orders:{},history:[],operators:['Kasiyer'],seq:1}}
function load(){try{let val=localStorage.getItem(STORAGE);if(!val)return defaultState();let s=JSON.parse(val);if(!s||!Array.isArray(s.tables)||!Array.isArray(s.products)||!s.orders||!Array.isArray(s.history))throw Error('format');return s}catch(e){console.warn(e);return defaultState()}}
let st=load();let ui={route:'home',zone:'z2',homeMode:'tables',setupStep:0,tableId:null,category:'cat0',drawer:false,modal:null,search:'',mobileOrderTab:'products',reportTab:'category',reportFrom:dateKey(new Date()),reportTo:dateKey(new Date()),reportText:'',manageSearch:'',manageCat:'',statusFilter:'all',payAmount:'',payMethod:'Nakit',payKeyFresh:true};
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(st))}catch(e){toast('Tarayıcı verileri saklayamadı. Yedek almanızı öneririz.','error')}}
function toast(msg,type='success'){let el=document.createElement('div');el.className='toast '+type;el.textContent=msg;document.querySelector('#toastWrap').append(el);setTimeout(()=>el.remove(),3500)}
function getOrder(){return ui.tableId?st.orders[ui.tableId]:null}
function getTable(id){return st.tables.find(t=>t.id===id)}
function isSpecial(id){return id?.startsWith('take_')||id?.startsWith('delivery_')}
function getTableName(id){return getTable(id)?.name||st.orders[id]?.label||'Sipariş'}
function getZone(id){return st.zones.find(z=>z.id===getTable(id)?.zoneId)}
function orderSub(o){return o?o.items.reduce((a,i)=>a+i.price*i.qty,0):0}
function discountValue(o){if(!o)return 0;return Math.min(orderSub(o),o.discountType==='percent'?orderSub(o)*(o.discount||0)/100:(o.discount||0))}
function orderTotal(o){return Math.max(0,Math.round((orderSub(o)-discountValue(o))*100)/100)}
function orderPaid(o){return o?.payments?.reduce((a,p)=>a+p.amount,0)||0}
function orderDue(o){return Math.max(0,Math.round((orderTotal(o)-orderPaid(o))*100)/100)}
function qtyOf(id){let o=getOrder();return o?.items.filter(it=>it.productId===id).reduce((a,i)=>a+i.qty,0)||0}
function getOpenCount(zone){return st.tables.filter(t=>t.zoneId===zone&&st.orders[t.id]?.items.length).length}
function getOrCreateOrder(id){if(!st.orders[id])st.orders[id]={id:'A'+String(st.seq++).padStart(7,'0'),tableId:id,label:getTableName(id),type:id.startsWith('take_')?'Gel Al':id.startsWith('delivery_')?'Paket':'Masa',createdAt:new Date().toISOString(),items:[],payments:[],discountType:'amount',discount:0,guest:'',guestCount:1,note:'',status:'Yeni',operator:st.settings.operator};return st.orders[id]}
function navigate(route){ui.route=route;ui.drawer=false;ui.modal=null;ui.search='';ui.manageSearch='';render()}
function enterTable(id){ui.tableId=id;ui.route='order';ui.category=st.categories[0]?.id||'';ui.search='';ui.mobileOrderTab='products';ui.payAmount='';ui.payMethod='Nakit';ui.payKeyFresh=true;render()}
function addItem(productId){let p=st.products.find(p=>p.id===productId);if(!p||!p.active)return;let o=getOrCreateOrder(ui.tableId),it=o.items.find(i=>i.productId===p.id&&i.status==='Yeni'&&(!i.note));if(it)it.qty++;else o.items.push({id:uid('l'),productId:p.id,name:p.name,categoryId:p.categoryId,price:p.price,qty:1,status:'Yeni',note:''});persist();render();}
function changeQty(productId,delta){const o=getOrder();if(!o){if(delta>0)addItem(productId);return}let matches=o.items.filter(i=>i.productId===productId);let it=matches.find(i=>i.status==='Yeni')||matches[matches.length-1];if(!it){if(delta>0)addItem(productId);return}if(delta>0){if(it.status!=='Yeni'){addItem(productId);return}it.qty++}else{if(it.status!=='Yeni'){toast('Gönderilmiş ürünü değiştirmek için satır menüsünü kullanın.','error');return}if(it.qty===1){const totalAfter=orderTotal({...o,items:o.items.filter(x=>x.id!==it.id)});if(orderPaid(o)>totalAfter+.005){toast('Alınan ödemeden düşük tutara inilemez.','error');return}o.items=o.items.filter(x=>x.id!==it.id)}else{const totalAfter=orderTotal({...o,items:o.items.map(x=>x.id===it.id?{...x,qty:x.qty-1}:x)});if(orderPaid(o)>totalAfter+.005){toast('Alınan ödemeden düşük tutara inilemez.','error');return}it.qty--}}if(o.items.length===0&&orderPaid(o)===0){delete st.orders[ui.tableId]}persist();render()}
function saveOrder(){let o=getOrder();if(!o||!o.items.length){toast('Kaydedilecek ürün bulunamadı.','error');return}let changes=o.items.filter(x=>x.status==='Yeni').length;o.items.forEach(x=>{if(x.status==='Yeni')x.status='Hazırlanıyor'});o.status='Hazırlanıyor';o.updatedAt=new Date().toISOString();persist();ui.tableId=null;ui.mobileOrderTab='products';navigate('home');toast(changes?`Sipariş kaydedildi (${changes} satır). Masalara dönüldü.`:'Sipariş kayıtlı. Masalara dönüldü.')}
function settleOrder(o){o.closedAt=new Date().toISOString();o.status='Ödendi';st.history.unshift(clone(o));delete st.orders[o.tableId];persist()}
function processPayment(amount,method,received=null){let o=getOrder();if(!o||!o.items.length){toast('Ödeme alınacak sipariş bulunamadı.','error');return}amount=Math.round(Number(amount)*100)/100;if(!Number.isFinite(amount)||amount<=0||amount>orderDue(o)+.005){toast('Geçerli bir tahsilat tutarı girin.','error');return}o.items.forEach(i=>{if(i.status==='Yeni')i.status='Hazırlanıyor'});o.payments.push({id:uid('pay'),amount,method,date:new Date().toISOString(),operator:st.settings.operator,...(method==='Nakit'&&Number.isFinite(received)&&received>=amount?{received,change:Math.round((received-amount)*100)/100}:{})});let closed=orderDue(o)<.01;if(closed)settleOrder(o);else persist();ui.modal=null;if(!closed&&ui.route==='payment'){ui.payAmount=String(orderDue(o));ui.payKeyFresh=true}render();toast(closed?'Ödeme tamamlandı. Masa kapatıldı.':`${fmt(amount)} tahsil edildi. Kalan: ${fmt(orderDue(o))}`);if(closed){ui.route='home';ui.tableId=null;render()}}
function quickPay(){const o=getOrder();if(!o||!o.items.length){toast('Masa boş.','error');return}let due=orderDue(o);if(due<=0)return;openModal('quickPay')}
function getReportOrders(){return st.history.filter(o=>{const day=dateKey(o.closedAt||o.createdAt);return day>=ui.reportFrom&&day<=ui.reportTo})}
function reportRows(){const orders=getReportOrders(),map=new Map();let rkey=ui.reportTab;for(const o of orders){const sub=orderSub(o),discount=discountValue(o);for(const i of o.items){let p=st.products.find(p=>p.id===i.productId);let name=rkey==='category'?(st.categories.find(c=>c.id===i.categoryId)?.name||'Silinen kategori'):rkey==='zone'?(o.label||getTableName(o.tableId)):rkey==='menu'?(o.type||'Masa'):rkey==='feature'?((i.note||'Özellik yok')):i.name;let itemSub=i.qty*i.price,itemDiscount=sub?discount*itemSub/sub:0;let a=map.get(name)||{name,qty:0,discount:0,total:0};a.qty+=i.qty;a.discount+=itemDiscount;a.total+=itemSub-itemDiscount;map.set(name,a)}}let rows=[...map.values()].sort((a,b)=>b.total-a.total);return rows.filter(r=>r.name.toLocaleLowerCase('tr').includes(ui.reportText.toLocaleLowerCase('tr')))}
function hTop(){return `<header class="titlebar"><b>◈ Adio <span style="font-weight:400;opacity:.82">/ Adisyon</span><span class="brand-credit-top">Hakan Aytaş CodeBug Şirketi</span></b><span>● Cihazda kayıtlı</span></header><div class="topline"><div class="logo-brand">${ic('coffee')} Adio</div><span class="utility">${ic('info')} Duyurular</span><span class="utility">${ic('person')} ${esc(st.settings.operator)}</span><span class="app-credit">Hakan Aytaş CodeBug Şirketi</span></div>`}
function sideRail(){return `<nav class="left-rail"><button class="rail-btn menu-first" data-act="drawer">${ic('menu')}<span>Menü</span></button><button class="rail-btn" data-act="new-special" data-type="take">${ic('bag')}<span>Gel Al</span></button><button class="rail-btn" data-act="new-special" data-type="delivery">${ic('truck')}<span>Paket</span></button></nav>`}
function home(){return `<section class="home"><div class="home-head"><div class="home-heading"><span class="eyebrow">ADIO · MASA YÖNETİMİ</span><h2>Masalar <span class="table-count">${st.tables.length}</span></h2></div><div class="toolbar-right"><span class="live-pill"><i></i>${st.tables.filter(t=>st.orders[t.id]?.items.length).length} dolu masa</span><button title="Yeni masa ekle" class="btn-icon" data-act="new-table">${ic('plus')}</button><button title="Yenile" class="btn-icon" data-act="refresh">${ic('refresh')}</button><button title="Ayarlar" class="btn-icon" data-act="goto" data-route="settings">${ic('settings')}</button></div></div>${regionView()}</section>`}
function regionView(){const tables=st.tables;return `<div class="tables-subhead"><span>${ic('grid')} Tüm Masalar</span><span class="muted">${tables.length-st.tables.filter(t=>st.orders[t.id]?.items.length).length} boş · ${st.tables.filter(t=>st.orders[t.id]?.items.length).length} dolu</span></div><div class="table-scroll"><div class="table-grid">${tables.map(t=>{let o=st.orders[t.id],busy=o?.items.length;return `<button class="table-card ${busy?'busy':''}" data-act="enter" data-id="${esc(t.id)}"><span class="table-status-dot"></span><span class="tbl-name">${esc(t.name)}</span>${busy?`<span class="tbl-customer">${esc(o.guest||'Açık adisyon')}${o.guestCount>1?' · '+o.guestCount+' kişi':''}</span><span class="tbl-total">${fmt(orderTotal(o))}</span><span class="tbl-time">${Math.max(0,Math.floor((Date.now()-new Date(o.createdAt))/60000))} dk · ${esc(o.status)}</span>${orderPaid(o)>0?`<span class="tbl-due">Kalan ${fmt(orderDue(o))}</span>`:''}`:`<span class="free-label">Boş masa</span>`}</button>`}).join('')}</div></div><div class="home-footnote">Adio · Veriler bu cihazdaki tarayıcıda saklanır. Yedek almak için Ayarlar'ı kullanın.</div>`}
function homeOrdersView(){const active=Object.values(st.orders).filter(o=>o.items.length).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));return `<div class="zone-head"><h3>Açık Siparişler (${active.length})</h3><button class="pill-btn" data-act="goto" data-route="orders">${ic('orders')} Tüm siparişler</button></div><div class="table-scroll">${active.length?`<div class="table-grid">${active.map(o=>`<button class="table-card busy" data-act="enter" data-id="${esc(o.tableId)}"><span class="tbl-name">${esc(getTableName(o.tableId))}</span><span class="tbl-customer">${esc(o.guest||o.type)}</span><span class="tbl-total">${fmt(orderTotal(o))}</span><span class="tbl-time">${time(o.createdAt)} · ${esc(o.status)}</span></button>`).join('')}</div>`:empty('orders','Açık sipariş yok','Yeni sipariş eklemek için bir masa seçin.')}</div>`}

function updatePaymentPreview(){
  const amount=document.getElementById('payAmount');if(!amount)return;
  const n=Number(amount.value)||0;ui.payAmount=amount.value;
  const preview=document.getElementById('paymentPreview'),label=document.getElementById('paymentConfirmLabel');
  if(preview)preview.textContent=fmt(n);
  if(label)label.textContent=fmt(n)+' Tahsil Et';
  const tender=document.getElementById('payTender'),change=document.getElementById('paymentChange');
  if(change)change.textContent=fmt(Math.max(0,(Number(tender?.value)||0)-n));
}
function changePaymentMethod(method){
  ui.payMethod=method;
  const hidden=document.getElementById('payMethod');if(hidden)hidden.value=method;
  for(const button of document.querySelectorAll('.payment-method')){
    const active=button.dataset.method===method;button.classList.toggle('selected',active);
    const check=button.querySelector('.method-check');if(check)check.remove();
    if(active){const mark=document.createElement('span');mark.className='method-check';mark.textContent='✓';button.appendChild(mark)}
  }
  const cash=document.getElementById('payTenderBox');if(cash)cash.classList.toggle('hide',method!=='Nakit');
  updatePaymentPreview();
}
function applyPayKey(key){
  const inp=document.getElementById('payAmount');if(!inp)return;
  let val=String(inp.value||'');
  if(key==='C'){val='';ui.payKeyFresh=true}
  else if(key==='⌫'){val=ui.payKeyFresh?'':val.slice(0,-1);ui.payKeyFresh=false}
  else if(key==='.') {if(ui.payKeyFresh){val='0';ui.payKeyFresh=false}if(!val.includes('.'))val+='.'}
  else if(/^\d$/.test(key)){if(ui.payKeyFresh){val='';ui.payKeyFresh=false}val+=key}
  inp.value=val;updatePaymentPreview();inp.focus();
}

function tablesPage(){return page('Masa Tanımlamaları',`<div class="filters"><span class="badge">${st.tables.length} masa</span><span class="muted sm">Masaların tamamı tek ekranda gösterilir.</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Masa</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody>${st.tables.map(t=>`<tr><td class="strong">${esc(t.name)}</td><td><span class="badge ${st.orders[t.id]?.items.length?'orange':'green'}">${st.orders[t.id]?.items.length?'Dolu':'Boş'}</span></td><td><button data-act="edit-table" data-id="${esc(t.id)}">Düzenle</button> <button data-act="delete-table" data-id="${esc(t.id)}">Sil</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="small-btn filled" data-act="new-table">${ic('plus')} Masa Ekle</button>`)}

function settingsPage(){return page('Ayarlar',`<form id="settingsForm" class="settings-box"><h3>İşletme Bilgileri</h3><div class="form-grid"><div class="field"><label>İşletme adı</label><input name="business" maxlength="70" required value="${esc(st.settings.business)}"></div><div class="field"><label>Aktif kullanıcı</label><select name="operator">${st.operators.map(p=>`<option ${p===st.settings.operator?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div><p class="muted sm">İşletme adı fişte görünür. Bu dosyada kullanıcı oturumu ve çevrimiçi yetkilendirme yoktur.</p><button class="small-btn filled" type="submit">${ic('check')} Kaydet</button></form><div class="settings-box"><h3>Veri Yedekleme</h3><p class="muted">Adisyonlar, kapanmış satışlar, ürünler ve ayarlar yalnızca bu tarayıcının yerel depolamasında tutulur. Düzenli yedek alın.</p><div class="page-actions"><button class="small-btn filled" data-act="backup">${ic('download')} JSON Yedeği İndir</button><button class="small-btn" data-act="import-click">${ic('upload')} Yedek Geri Yükle</button><input id="backupFile" type="file" accept=".json,application/json" hidden></div></div><div class="settings-box"><h3>Diğer</h3><div class="page-actions"><button class="small-btn" data-act="goto" data-route="users">${ic('users')} Personeller</button><button class="small-btn" data-act="goto" data-route="printers">${ic('print')} Yazdırma</button><button class="small-btn danger" data-act="reset-request">${ic('trash')} Tüm verileri sıfırla</button></div></div>`)}
function usersPage(){return page('Kullanıcılar',`<div class="note">Bu tek dosyalık sürümde personel isimleri kayıt ve raporlama içindir. Şifreli giriş, izin yönetimi ve cihazlar arası eşzamanlama için sunucu gerekir.</div><h3 class="block-title">Tanımlı personeller</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Personel</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody>${st.operators.map(p=>`<tr><td>${esc(p)}</td><td><span class="badge ${st.settings.operator===p?'green':''}">${st.settings.operator===p?'Aktif':'Personel'}</span></td><td><button data-act="switch-user" data-name="${esc(p)}">Aktif yap</button> <button data-act="delete-user" data-name="${esc(p)}">Sil</button></td></tr>`).join('')}</tbody></table></div>`,`<button class="small-btn filled" data-act="add-user">${ic('plus')} Personel Ekle</button>`)}
function printersPage(){return page('Yazıcılar',`<div class="settings-box"><h3>Fiş Yazdırma</h3><p>Adisyon ekranındaki ${ic('print')} simgesiyle o adisyonun fişini yazdırabilir, ödenen adisyonun fişini Siparişler menüsünden açabilirsiniz.</p><p class="muted">Fiş, yalnızca adisyondaki ürün satırları kadar uzayan dar ve dikey 80 mm düzeninde hazırlanır. Yazdır penceresinde kâğıt boyutunu 80 mm Termal/Rulo (veya yazıcınızın 80 mm özel formu), yönü Dikey, ölçeği %100, kenar boşluklarını Yok, üstbilgi ve altbilgileri Kapalı seçin. A4 veya Yatay seçilirse fişin sağında büyük boşluk oluşur. Kâğıdı kesme davranışı yazıcı sürücüsüne bağlıdır; doğrudan ESC/POS bağlantısı bulunmaz.</p><button class="small-btn filled" data-act="print-test">${ic('print')} Test Fişi Yazdır</button></div>`)}
function digitalPage(){return page('Dijital Menü',`<div class="note">Bu menü, tanımlanan ürünlerin salt okunur görünümüdür. Müşteri bağlantısı veya QR kodu yayımlamak için ayrı bir sunucu gerekir.</div>${st.categories.map(c=>{let products=st.products.filter(p=>p.categoryId===c.id&&p.active);return products.length?`<h3 class="block-title">${esc(c.name)}</h3><div class="table-wrap"><table class="data-table">${products.map(p=>`<tr><td>${esc(p.name)}</td><td style="text-align:right">${fmt(p.price)}</td></tr>`).join('')}</table></div>`:''}).join('')}`)}
function renderPage(){switch(ui.route){case'home':return home();case'order':return renderOrder();case'payment':return paymentPage();case'reports':return reports();case'orders':return ordersPage();case'products':return productsPage();case'categories':return categoriesPage();case'tables':return tablesPage();case'payments':return paymentsPage();case'settings':return settingsPage();case'users':return usersPage();case'printers':return printersPage();case'digital':return digitalPage();default:return home()}}
const navGroups=[['Ana Sayfa','home','house'],['Entegrasyon İşlemleri','integrations','grid'],['Dijital Menü','digital','coffee'],['Tanımlamalar','definitions','clipboard'],['Sipariş','orders','orders'],['İşlemler','operations','wallet'],['Kullanıcılar','users','users'],['Raporlar','reports','chart'],['Yazıcılar','printers','print']];
function drawerView(){const sub=(entries)=>entries.map(x=>`<button class="drawer-item drawer-sub" data-act="goto" data-route="${x[1]}">${esc(x[0])}</button>`).join('');return `<div class="drawer-shade" id="drawerShade"><aside class="drawer" role="navigation"><div class="drawer-head"><div><div class="drawer-brand">${ic('coffee')} Adio <span class="muted sm">1.0</span></div><div class="drawer-company">${esc(st.settings.business)}</div></div><button class="xbtn" data-act="drawer-close">${ic('close')}</button></div><div class="drawer-list">${navGroups.map(n=>`${n[1]==='integrations'?`<button class="drawer-item" data-act="unsupported" data-name="Entegrasyon İşlemleri">${ic(n[2])} ${n[0]}</button>`:n[1]==='definitions'?`<button class="drawer-item" data-act="goto" data-route="products">${ic(n[2])} Tanımlamalar ${ic('arrow','mini')}</button>${sub([['Ürünler','products'],['Kategoriler','categories'],['Masalar','tables']])}`:n[1]==='operations'?`<button class="drawer-item" data-act="goto" data-route="payments">${ic(n[2])} İşlemler ${ic('arrow','mini')}</button>${sub([['Tahsilat Hareketleri','payments'],['Veri Yedekleme','settings']])}`:`<button class="drawer-item ${ui.route===n[1]?'selected':''}" data-act="goto" data-route="${n[1]}">${ic(n[2])} ${n[0]}</button>`}`).join('')}</div><div class="drawer-bottom"><b>Adio · Çevrimdışı</b><p>Çalışma: Çevrimdışı · Kayıt: Bu tarayıcı</p><button class="small-btn" data-act="goto" data-route="settings">${ic('settings')} Ayarlar</button></div></aside></div>`}
function setupView(){const step=ui.setupStep||0;const names=['Hoş geldiniz','İşletme kurulumu'];return `<div class="setup-shell"><div class="setup-glow"></div><div class="setup-top"><div class="setup-logo"><span class="setup-mark">A</span> Adio</div><span class="setup-top-label">İLK KURULUM <strong>0${step+1} / 02</strong></span></div><div class="setup-center"><div class="setup-card"><div class="setup-progress"><span class="${step>=0?'on':''}"></span><span class="${step>=1?'on':''}"></span></div>${step===0?`<div class="setup-symbol">${ic('coffee')}</div><div class="setup-kicker">ADIO ADİSYON SİSTEMİ</div><h1>İşletmenizin yeni<br><em>başlangıç noktası.</em></h1><p class="setup-lead">Masalar, siparişler ve ödemeler tek yerde. İşletmenizi bir kez kurun; sonraki açılışlarda doğrudan masa ekranınıza geçin.</p><div class="setup-feature-grid"><div>${ic('table')} Masa yönetimi</div><div>${ic('orders')} Sipariş takibi</div><div>${ic('wallet')} Ödeme & rapor</div><div>${ic('lock')} Cihazda kayıt</div></div><button class="setup-primary" data-act="setup-start">Kuruluma Başla ${ic('arrow')}</button>`:`<div class="setup-kicker">SON ADIM · SİZE ÖZEL</div><h1>Adio'yu <em>hazırlayalım.</em></h1><p class="setup-lead">Bu bilgileri bir defa girmeniz yeterli. Daha sonra Ayarlar bölümünden işletme adını ve masaları değiştirebilirsiniz.</p><form id="setupForm" class="setup-form"><label>İşletme adı<input name="business" required maxlength="70" placeholder="Örn. Rammy Coffee" value="${esc(st.settings.business||'')}"></label><label>Personel / kasa adı<input name="operator" required maxlength="70" placeholder="Örn. Kasiyer" value="${esc(st.settings.operator||'Kasiyer')}"></label><label>Masa sayısı<input name="tableCount" type="number" min="1" max="200" required value="${st.tables.length}"></label><div class="setup-hint">${ic('info')} Kurulum bu tarayıcıda saklanır. Aynı işletmeyi başka cihazlarda kullanacaksanız verileri JSON yedeğiyle taşıyabilirsiniz.</div><div class="setup-buttons"><button type="button" class="setup-secondary" data-act="setup-back">${ic('back')} Geri</button><button type="submit" class="setup-primary">Adio'yu Aç ${ic('check')}</button></div></form>`}</div><div class="setup-footer">Adio <span>·</span> Hakan Aytaş CodeBug Şirketi</div></div></div>`}
function finishSetup(form){const fd=new FormData(form);let business=String(fd.get('business')||'').trim(),operator=String(fd.get('operator')||'').trim(),count=Number(fd.get('tableCount'));if(!business||!operator||!Number.isInteger(count)||count<1||count>200){toast('İşletme adı, personel ve 1–200 arası masa sayısı girin.','error');return}const ordered=st.tables.slice();if(ordered.slice(count).some(t=>st.orders[t.id]?.items?.length)){toast('Açık adisyonu bulunan masalar korunmalı. Daha yüksek masa sayısı seçin.','error');return}st.tables=ordered.slice(0,count);while(st.tables.length<count){let n=st.tables.length+1;st.tables.push({id:uid('table'),zoneId:'z1',name:'Masa '+n})}st.zones=[{id:'z1',name:'Salon'}];st.tables.forEach((t,i)=>{t.zoneId='z1';if(/^Masa \d+$/i.test(t.name)){t.name='Masa '+(i+1);if(st.orders[t.id])st.orders[t.id].label=t.name}});st.settings.business=business;st.settings.operator=operator;st.settings.setupDone=true;st.operators=st.operators||[];if(!st.operators.includes(operator))st.operators.unshift(operator);ui.route='home';ui.zone='z1';persist();render();toast('Adio hazır! Hoş geldiniz.')}
function render(){document.title=(ui.route==='order'?getTableName(ui.tableId)+' - ':'')+'Adio · Hakan Aytaş CodeBug Şirketi';if(!st.settings?.setupDone){document.getElementById('app').innerHTML=setupView();document.getElementById('overlays').innerHTML='';return}document.getElementById('app').innerHTML=hTop()+`<div class="app-area">${ui.route==='home'?sideRail():''}<main class="main-area">${renderPage()}</main></div>`;document.getElementById('overlays').innerHTML=(ui.drawer?drawerView():'')+(ui.modal?modalView():'');}
function openModal(type,data={}){ui.drawer=false;ui.modal={type,...data};render()}
function closeModal(){ui.modal=null;render()}
function formField(label,name,value='',type='text',attrs=''){return `<div class="field"><label>${esc(label)}</label><input type="${type}" name="${esc(name)}" value="${esc(value)}" ${attrs}></div>`}
function modal(title,body,buttons='',wide=false){return `<div class="modal-overlay" id="modalOverlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" data-act="modal-close">${ic('close')}</button></div>${body}<div class="modal-foot"><button class="small-btn" data-act="modal-close">Vazgeç</button>${buttons}</div></div></div>`}
function modalForm(title,id,fields,submit='Kaydet',wide=false){return modal(title,`<form id="${id}" class="modal-body">${fields}<button type="submit" class="small-btn filled" style="align-self:flex-end">${esc(submit)}</button></form>`,'',wide)}
function modalView(){let m=ui.modal,o=getOrder();switch(m.type){
case'guest':return modalForm('Adisyon Bilgileri','guestForm',`${formField('Müşteri / adisyon adı','guest',o?.guest||'', 'text','maxlength="75" placeholder="Müşteri adı (isteğe bağlı)"')}${formField('Kişi sayısı','guestCount',o?.guestCount||1,'number','min="1" max="99" required')}<div class="field"><label>Sipariş notu</label><textarea name="note" maxlength="500">${esc(o?.note||'')}</textarea></div>`);
case'info':return modal('Sipariş Bilgileri',`<div class="modal-body"><div class="card"><b>Adisyon:</b> ${esc(o?.id||'Henüz açılmadı')}<br><b>Masa:</b> ${esc(getTableName(ui.tableId))}<br><b>Açılış:</b> ${o?dateTime(o.createdAt):'—'}<br><b>Personel:</b> ${esc(o?.operator||st.settings.operator)}<br><b>Durum:</b> ${esc(o?.status||'Yeni')}<br><b>Not:</b> ${esc(o?.note||'—')}</div><button class="small-btn" data-act="table-actions">${ic('table')} Masa İşlemleri</button></div>`);
case'discount':return modalForm('Adisyon İndirimi','discountForm',`<div class="note">İndirim toplam tutara uygulanır. Daha önce tahsil edilen miktardan düşük yeni toplam oluşturulamaz.</div><div class="field"><label>İndirim Türü</label><select name="discountType"><option value="amount" ${o?.discountType!=='percent'?'selected':''}>Tutar (₺)</option><option value="percent" ${o?.discountType==='percent'?'selected':''}>Yüzde (%)</option></select></div>${formField('İndirim değeri','discount',o?.discount||0,'number','min="0" step="0.01" required')}`,'İndirimi Uygula');
case'pay':{let due=orderDue(o);return modal('Ödeme Al',`<form id="payForm" class="modal-body"><div class="modal-stat"><div class="muted">Tahsil edilecek kalan tutar</div><b>${fmt(due)}</b></div><div class="field"><label>Ödenecek tutar (₺)</label><input id="payAmount" name="amount" type="number" min="0.01" step="0.01" max="${due}" value="${m.amount??due}" required></div><div class="preset-row"><button type="button" data-act="pay-preset" data-value="${due}">Tamamı</button><button type="button" data-act="pay-preset" data-value="${(due/2).toFixed(2)}">Yarısı</button><button type="button" data-act="pay-preset" data-value="${(due/3).toFixed(2)}">1/3</button><button type="button" data-act="pay-by-items">${ic('tag','mini')} Ürüne Göre</button></div><div class="field"><label>Ödeme yöntemi</label><select name="method"><option>Nakit</option><option>Kredi Kartı</option><option>Havale / EFT</option><option>Diğer</option></select></div><button class="small-btn filled" type="submit" style="align-self:flex-end">${ic('check')} Tahsil Et</button></form>`)}
case'payItems':{const sub=orderSub(o),mult=sub?orderTotal(o)/sub:1;return modal('Ürüne Göre Hesap Bölme',`<div class="modal-body"><p class="muted">Ödeme alınacak ürün satırlarını seçin. İndirim tutarlara orantılı dağıtılır.</p><div style="max-height:320px;overflow:auto">${o.items.map(i=>`<label style="display:flex;gap:12px;align-items:center;padding:13px 7px;border-bottom:1px solid var(--line)"><input type="checkbox" class="pay-item" value="${esc(i.id)}" style="width:20px;height:20px"><span style="flex:1">${esc(i.qty+' × '+i.name)}</span><b>${fmt(i.price*i.qty*mult)}</b></label>`).join('')}</div><div class="modal-stat"><b id="payItemsSum">${fmt(0)}</b></div><button class="small-btn filled" data-act="pay-items-confirm">${ic('check')} Tutarı Ödemeye Aktar</button></div>`)}
case'quickPay':return modal('Hızlı Ödeme',`<div class="modal-body"><div class="modal-stat"><div class="muted">Nakit olarak alınacak kalan tutar</div><b>${fmt(orderDue(o))}</b></div><div class="note">Onayladığınızda kalan tutar nakit olarak tahsil edilir ve adisyon kapanır.</div></div>`,`<button class="small-btn filled" data-act="quick-confirm">${ic('check')} Nakit Tahsil Et</button>`);
case'line':{let i=o?.items.find(x=>x.id===m.id);if(!i)return '';return modal('Ürün İşlemleri',`<form id="lineForm" class="modal-body"><div class="note"><b>${esc(i.name)}</b> · ${fmt(i.price)} / adet<br>Durum: ${esc(i.status)}</div>${formField('Adet','qty',i.qty,'number','min="1" max="999" required')}<div class="field"><label>Durum</label><select name="status">${['Yeni','Hazırlanıyor','Servis Edildi'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Ürün notu</label><textarea name="note" maxlength="240">${esc(i.note||'')}</textarea></div><button type="submit" class="small-btn filled">${ic('check')} Güncelle</button></form>`,`<button class="small-btn danger" data-act="remove-line" data-id="${esc(i.id)}">${ic('trash')} Sil</button>`)}
case'tableActions':return modal('Masa İşlemleri',`<div class="modal-body"><div class="note">${esc(getTableName(ui.tableId))} · ${fmt(orderTotal(o))} · Ödenen ${fmt(orderPaid(o))}</div>${getTable(ui.tableId)?`<button class="small-btn" data-act="move-select">${ic('table')} Başka Masaya Taşı / Birleştir</button>`:''}<button class="small-btn" data-act="guest">${ic('edit')} Adisyon Bilgileri</button><button class="small-btn" data-act="print">${ic('print')} Fiş Yazdır</button></div>`);
case'move':{let targets=st.tables.filter(t=>t.id!==ui.tableId);return modalForm('Masa Taşı / Birleştir','moveForm',`<p class="note">Hedef masa boşsa taşınır, doluysa ürünler birleştirilir. Birleştirilen adisyonların indirimleri tutar olarak korunur.</p><div class="field"><label>Hedef masa</label><select name="target" required>${targets.map(t=>`<option value="${esc(t.id)}">${esc(st.zones.find(z=>z.id===t.zoneId)?.name)} / ${esc(t.name)}${st.orders[t.id]?.items.length?' (DOLU)':''}</option>`).join('')}</select></div>`,'Onayla')}
case'product':{let p=st.products.find(p=>p.id===m.id);return modalForm(p?'Ürün Düzenle':'Yeni Ürün','productForm',`${formField('Ürün adı','name',p?.name||'','text','required maxlength="110"')}<div class="field"><label>Kategori</label><select name="categoryId" required>${st.categories.map(c=>`<option value="${esc(c.id)}" ${p?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${formField('Satış fiyatı (₺)','price',p?.price??0,'number','min="0" step="0.01" required')}<div class="field"><label>Satış Durumu</label><select name="active"><option value="true" ${p?.active!==false?'selected':''}>Aktif</option><option value="false" ${p?.active===false?'selected':''}>Pasif</option></select></div>`)}
case'category':{let c=st.categories.find(c=>c.id===m.id);return modalForm(c?'Kategori Düzenle':'Kategori Ekle','categoryForm',`${formField('Kategori adı','name',c?.name||'','text','required maxlength="75"')}`)}
case'table':{let t=getTable(m.id);return modalForm(t?'Masayı Düzenle':'Yeni Masa','tableForm',formField('Masa adı','name',t?.name||`Masa ${st.tables.length+1}`,'text','required maxlength="70"'))}
case'zone':{let z=st.zones.find(z=>z.id===m.id);return modalForm(z?'Bölge Düzenle':'Yeni Bölge','zoneForm',`${formField('Bölge adı','name',z?.name||'','text','required maxlength="70"')}`,'Kaydet')}
case'addUser':return modalForm('Personel Ekle','userForm',formField('Personel adı','name','','text','required maxlength="70"'));
case'reset':return modal('Tüm Verileri Sıfırla',`<div class="modal-body"><div class="note" style="background:#fff3f0;border-color:#ffdbd5">Bu işlem tüm masaları, siparişleri, satış geçmişini, ürünleri ve ayarları kalıcı olarak sıfırlar. Önce yedek alın.</div>${formField('Onay için SIFIRLA yazın','confirmation','','text','id="resetText" autocomplete="off"')}</div>`,`<button class="small-btn danger" data-act="reset-confirm">Verileri Sıfırla</button>`);

function onChange(e){let t=e.target;if(t.id==='dateFrom'){ui.reportFrom=t.value;render()}else if(t.id==='dateTo'){ui.reportTo=t.value;render()}else if(t.id==='manageCat'){ui.manageCat=t.value;render()}else if(t.id==='statusFilter'){ui.statusFilter=t.value;render()}else if(t.classList.contains('pay-item'))updateSelectedSum();else if(t.id==='backupFile')importBackup(t.files?.[0])}
async function importBackup(file){if(!file)return;try{let s=JSON.parse(await file.text());if(!s||!Array.isArray(s.zones)||!Array.isArray(s.tables)||!Array.isArray(s.products)||!Array.isArray(s.categories)||!Array.isArray(s.history)||!s.orders||!Array.isArray(s.operators)||!s.settings||typeof s.settings.business!=='string')throw Error('Format geçersiz');if(!confirm('Mevcut bütün kayıtlar seçilen yedek ile değiştirilecek. Devam edilsin mi?'))return;st=s;persist();ui.route='home';ui.zone=s.zones[0]?.id||'';ui.tableId=null;ui.modal=null;render();toast('Yedek geri yüklendi.')}catch(err){toast('Yedek açılamadı: '+err.message,'error')}}
document.addEventListener('click',onClick);document.addEventListener('submit',formSubmit);document.addEventListener('input',onInput);document.addEventListener('change',onChange);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.modal||ui.drawer)){ui.modal=null;ui.drawer=false;render()}});
render();
</script>
</body></html>
